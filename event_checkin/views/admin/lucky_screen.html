<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Quay số: {{ event.ten_su_kien }}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='lucky/lucky.css') }}">
</head>
<body>
<header class="topbar" role="banner"></header>

<main class="page">
  <div class="page-head">
    <h1 class="page-title">{{ event.ten_su_kien }}</h1>
    <div class="page-actions">
      <a class="btn" href="{{ setup_url }}">Sửa thiết lập</a>
      <a class="btn" href="{{ back_url }}">← Danh sách quay số</a>
    </div>
  </div>
  <section class="stage" id="stage" aria-label="Khu vực quay số">
    <canvas id="confetti" aria-hidden="true"></canvas>
    <div class="mascot" aria-hidden="true">🦉</div>
    <div class="mascot r" aria-hidden="true">📖</div>
    <button class="btn btn-results" type="button" id="btnResults" aria-label="Xem các giải đã trúng" title="Xem các giải đã trúng">➜</button>

    <div class="stage-top">
      <div class="stage-prize" id="stagePrize"></div>
      <button class="btn" type="button" id="btnFull">Toàn màn hình</button>
    </div>

    <div class="stage-prizes" aria-label="Chọn giải">
      <label for="prizeSelect">Giải</label>
      <select id="prizeSelect"></select>
      <div class="pool" id="poolText"></div>
    </div>

    <div class="slots" id="slots" data-n="1" aria-live="polite"></div>

    <div class="stage-bottom">
      <button class="draw" type="button" id="btnDraw">QUAY</button>
      <span class="confirm-box hidden" id="confirmBox">
        <button class="btn act-save" type="button" id="btnSave">Lưu</button>
        <button class="btn act-redo" type="button" id="btnRedo">Quay lại</button>
      </span>
      <div id="msg" role="alert"></div>
    </div>

    <div class="results-view hidden" id="resultsView" role="dialog" aria-label="Các giải đã trúng">
      <button class="btn rv-close" type="button" id="btnResultsClose">✕ Đóng</button>
      <div class="rv-title">DANH SÁCH TRÚNG THƯỞNG</div>
      <div class="rv-body" id="rvBody"></div>
    </div>

    <div class="modal hidden" id="redoModal" role="dialog" aria-modal="true" aria-labelledby="redoText">
      <div class="modal-box">
        <p id="redoText">Bạn có chắc chắn muốn quay lại? Kết quả hiện tại sẽ bị bỏ.</p>
        <div class="btns">
          <button class="btn danger" type="button" id="btnRedoYes">Quay lại</button>
          <button class="btn" type="button" id="btnRedoNo">Giữ kết quả</button>
        </div>
      </div>
    </div>
  </section>
</main>

<script>window.LUCKY = { eventId: {{ event.id }} };</script>
<script src="{{ url_for('static', filename='lucky/lucky.js') }}"></script>
</body>
</html>
