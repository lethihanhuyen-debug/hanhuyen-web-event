{% extends 'base.html' %}
{% block title %}Check-in | Event Check-in{% endblock %}

{% block content %}
<section class="checkin-stage">
  <div class="checkin-card">
    <p class="eyebrow">Check-in sự kiện</p>
    <h1>Quét hoặc nhập mã CB/SV</h1>
    <p class="muted">Hệ thống sẽ phản hồi ngay phía dưới và tự động sẵn sàng cho lần quét tiếp theo.</p>

    <div class="checkin-form">
      <input id="checkinInput" type="text" placeholder="Nhập hoặc quét Mã CB/SV" autocomplete="off" autofocus>
      <button id="checkinBtn" class="btn btn--primary" type="button">Check-in</button>
    </div>

    <div id="checkinResult" class="checkin-result" aria-live="polite"></div>
  </div>
</section>
{% endblock %}

{% block scripts %}
<script>
(function () {
  const input = document.getElementById('checkinInput');
  const button = document.getElementById('checkinBtn');
  const result = document.getElementById('checkinResult');
  let submitting = false;
  // Bumped on every new check-in so a late-arriving poll from an earlier scan
  // can't overwrite the message for whatever was scanned after it.
  let latestToken = 0;

  function paint(kind, text) {
    result.className = 'checkin-result checkin-result--' + kind;
    result.textContent = text;
  }

  function pollEmailStatus(token, ma_cbsv, event_id, ho_ten, thoi_gian, email, attemptsLeft) {
    if (token !== latestToken || attemptsLeft <= 0) return;
    setTimeout(async () => {
      if (token !== latestToken) return;
      try {
        const response = await fetch(`/api/checkin/email-status/${encodeURIComponent(ma_cbsv)}/${event_id}`);
        const data = await response.json();
        if (token !== latestToken) return;
        if (data.status === 'success') {
          paint('success', '✅ Cảm ơn ' + ho_ten + ' đã check-in lúc ' + thoi_gian + '. Email xác nhận đã gửi tới ' + (email || 'địa chỉ đã đăng ký') + '.');
          return;
        }
        if (data.status === 'failed') {
          paint('warning', '⚠️ Cảm ơn ' + ho_ten + ' đã check-in lúc ' + thoi_gian + '. Nhưng gửi email xác nhận thất bại.');
          return;
        }
        pollEmailStatus(token, ma_cbsv, event_id, ho_ten, thoi_gian, email, attemptsLeft - 1);
      } catch (error) {
        // Network hiccup while polling -- check-in itself already succeeded, so just stop quietly.
      }
    }, 1500);
  }

  async function submitCheckin() {
    if (submitting) return; // ignore double-tap / double-Enter while a request is in flight
    const ma_cbsv = input.value.trim();
    if (!ma_cbsv) {
      paint('error', 'Vui lòng nhập mã CB/SV.');
      input.focus();
      return;
    }

    submitting = true;
    button.disabled = true;
    const token = ++latestToken;
    paint('pending', 'Đang xử lý...');

    try {
      const response = await fetch('/api/checkin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ma_cbsv }),
      });
      const data = await response.json();
      if (token !== latestToken) return; // a newer scan already started

      if (response.status === 404) {
        paint('error', '❌ Mã ' + ma_cbsv + ' chưa đăng ký tham gia chương trình');
      } else if (data.checked_in) {
        paint('warning', '⚠️ ' + data.message);
      } else if (data.success) {
        paint('pending', '✅ Cảm ơn ' + data.ho_ten + ' đã check-in lúc ' + data.thoi_gian + '. Đang gửi email xác nhận...');
        pollEmailStatus(token, ma_cbsv, 1, data.ho_ten, data.thoi_gian, data.email, 8);
      } else {
        paint('error', data.message || 'Đã xảy ra lỗi.');
      }
    } catch (error) {
      if (token === latestToken) paint('error', 'Không thể kết nối máy chủ.');
    } finally {
      submitting = false;
      button.disabled = false;
      input.value = '';
      input.focus();
    }
  }

  button.addEventListener('click', submitCheckin);
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter') {
      event.preventDefault();
      submitCheckin();
    }
  });
})();
</script>
{% endblock %}
